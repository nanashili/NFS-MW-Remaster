[trace]
; Safe distribution default. Set enabled=1 only for a planned capture run.
enabled=1
schema=4
profile=zbware
capture_exits=0
max_events=100000
checkpoint_interval=4096
flush_interval_ms=1000

; Profiles: survey, core, racer, traffic, pursuit, helicopter, navigation,
; zbware, all.
; Profile defaults come from hook_catalogue.json and are embedded in every
; capture manifest. An optional sample_<hook>=N line overrides one hook;
; 0 disables it and N records calls 1, 1+N, 1+2N, ... .
; Example: sample_AIVehicleRacecar_Update=64
